# ==============================================================================
# Cyber Threat Detection & Classification - Capstone Configuration
# ==============================================================================

project:
  name: "AI-Powered Dual-Stage Network Intrusion Detection System (NIDS)"
  version: "2.0.0"
  description: "Grand Unified Capstone Project: High-throughput binary threat detection and multi-class attack taxonomy classification on network flow data."

paths:
  data_dir: "data"
  raw_data_dir: "data"
  primary_dataset: "data/cicids2017_cleaned.csv"
  telemetry_stream: "data/network_telemetry_stream.csv"
  models_dir: "models"
  reports_dir: "docs"

training:
  random_state: 42
  test_size: 0.25
  sample_size: 35000         # Trains on the complete 35,000 cleaned flows
  cross_validation_folds: 5

stage1_binary:
  model_type: "decision_tree" # options: decision_tree, random_forest, mlp, logistic_regression
  params:
    max_depth: 12
    class_weight: "balanced"
    random_state: 42
  threshold: 0.50

stage2_multiclass:
  model_type: "random_forest"
  params:
    n_estimators: 100
    max_depth: 15
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1

feature_engineering:
  port_bins: [-1, 1023, 49151, 65535]
  port_labels: ["well_known", "registered", "dynamic"]
  missing_strategy: "median"
  scale_numeric: true

attack_taxonomy:
  BENIGN: "Normal"
  DDoS: "DDoS Attack"
  DoS Hulk: "DoS (Hulk)"
  DoS GoldenEye: "DoS (GoldenEye)"
  DoS slowloris: "DoS (Slowloris)"
  DoS Slowhttptest: "DoS (Slowhttptest)"
  PortScan: "PortScan Reconnaissance"
  FTP-Patator: "Brute Force (FTP)"
  SSH-Patator: "Brute Force (SSH)"
  Bot: "Botnet Activity"
  Web Attack - Brute Force: "Web Attack (Brute Force)"
  Web Attack - XSS: "Web Attack (XSS)"
  Web Attack - Sql Injection: "Web Attack (SQL Injection)"
  Infiltration: "Infiltration Attack"
  Heartbleed: "Heartbleed Vulnerability Exploit"
